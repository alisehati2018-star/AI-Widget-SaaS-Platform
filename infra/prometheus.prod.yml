# Prometheus scrape config for the PRODUCTION compose (Phase 9).
# Only services that actually exist in docker-compose.prod.yml are scraped —
# the dev prometheus.yml also targets the (not-deployed) gateway skeleton.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: vitrin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }
